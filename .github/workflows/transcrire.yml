name: Transcrire une voix (mots horodatés)
# Pour chaque voix/transcrire/<nom>.wav poussé : écrit voix/transcrire/<nom>.json (mots + début/fin), avec faster-whisper (local au runner, rien d'envoyé ailleurs).
on:
  push:
    paths: ['voix/transcrire/*.wav']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q faster-whisper
      - name: Transcrire
        run: python3 voix/transcrire.py > voix/transcrire/journal.txt 2>&1 || true
      - name: Pousser
        run: |
          git config user.name "machine-reels"; git config user.email "machine-reels@users.noreply.github.com"
          git add voix/transcrire && git commit -m "mots horodatés" || exit 0
          git pull --rebase -q && git push
