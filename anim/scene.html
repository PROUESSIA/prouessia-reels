<!doctype html>
<html><head><meta charset="utf-8">

<script type="module">
// Mini-série low-poly « Le devis de Mme Bernard » — personnages SANS yeux ni bouche (demande de la fondatrice).
import * as THREE from 'three';
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#141a2c');
scene.fog = new THREE.Fog('#141a2c', 9, 18);
const cam = new THREE.PerspectiveCamera(44, W / H, 0.05, 50);

const M = (c, o = {}) => new THREE.MeshStandardMaterial({color: c, flatShading: true, roughness: .85, metalness: 0, ...o});
function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof mat === 'string' ? M(mat) : mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}

// ---------- la cuisine ----------
box(8, .1, 8, '#6b4a33', 0, -.05, 0);                       // parquet
for (let i = -4; i < 4; i += .5) box(.01, .002, 8, '#5a3d2a', i, .001, 0);
box(8, 3.2, .1, '#c9b79c', 0, 1.6, -3);                     // mur du fond
box(.1, 3.2, 8, '#bfae93', -3.4, 1.6, 0);                   // mur gauche
box(8, .1, 8, '#a89a85', 0, 3.2, 0);                        // plafond
// fenêtre de nuit avec la ville
const cv = document.createElement('canvas'); cv.width = 512; cv.height = 512; const g = cv.getContext('2d');
const grd = g.createLinearGradient(0, 0, 0, 512); grd.addColorStop(0, '#0b1230'); grd.addColorStop(1, '#283a6a'); g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 14; i++) { const x = i * 40 - 10 + rnd() * 10, w = 34 + rnd() * 16, h = 160 + rnd() * 260;
  g.fillStyle = ['#1a2140', '#222a4d', '#161c36'][i % 3]; g.fillRect(x, 512 - h, w, h);
  for (let yy = 512 - h + 10; yy < 500; yy += 18) for (let xx = x + 5; xx < x + w - 8; xx += 11) if (rnd() < .35) { g.fillStyle = rnd() < .5 ? '#ffd88a' : '#ffbe5c'; g.fillRect(xx, yy, 6, 9); } }
const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
const win = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.3), new THREE.MeshBasicMaterial({map: tex}));
win.position.set(.9, 1.85, -2.94); scene.add(win);
box(1.95, .08, .14, '#e8e2d6', .9, 1.18, -2.9); box(1.95, .08, .14, '#e8e2d6', .9, 2.52, -2.9);
box(.08, 1.4, .14, '#e8e2d6', -.05, 1.85, -2.9); box(.08, 1.4, .14, '#e8e2d6', 1.85, 1.85, -2.9); box(.05, 1.3, .1, '#e8e2d6', .9, 1.85, -2.9);
// plan de travail + placards
box(2.6, .9, .65, '#3e5c58', -1.9, .45, -2.6); box(2.7, .05, .7, '#d9d2c4', -1.9, .92, -2.58);
for (let i = 0; i < 4; i++) box(.6, .7, .02, '#456864', -3 + i * .64 + .3, .45, -2.27);
box(2.6, .75, .4, '#3e5c58', -1.9, 2.35, -2.78);
box(.7, 1.9, .7, '#dcdcdc', 2.6, .95, -2.55);                // frigo
box(.05, .5, .03, '#888', 2.3, 1.2, -2.19);
// horloge 22 h
const clock = new THREE.Mesh(new THREE.CylinderGeometry(.22, .22, .04, 24), M('#f4efe6')); clock.rotation.x = Math.PI / 2; clock.position.set(-1.2, 2.25, -2.93); scene.add(clock);
const hH = box(.025, .11, .01, '#222', 0, 0, 0); hH.geometry.translate(0, .055, 0); hH.position.set(-1.2, 2.25, -2.9); hH.rotation.z = Math.PI / 3; // 22 h
const hM = box(.018, .17, .01, '#222', 0, 0, 0); hM.geometry.translate(0, .085, 0); hM.position.set(-1.2, 2.25, -2.89);
// table, chaises, objets
box(1.7, .07, 1.1, '#8a5a36', .2, .78, .2);
for (const [x, z] of [[-.55, -.25], [.95, -.25], [-.55, .65], [.95, .65]]) box(.07, .75, .07, '#6e4628', x, .375, z);
function chaise(x, z, rot) { const c = new THREE.Group(); c.position.set(x, 0, z); c.rotation.y = rot; scene.add(c);
  box(.48, .05, .45, '#5b3a22', 0, .47, 0, c); box(.48, .55, .05, '#5b3a22', 0, .75, .21, c);
  for (const [a, b] of [[-.2, -.18], [.2, -.18], [-.2, .18], [.2, .18]]) box(.04, .47, .04, '#4a2f1b', a, .235, b, c); }
chaise(.35, 1.05, 0); chaise(-.9, .2, Math.PI / 2);
const papiers = [];
for (let i = 0; i < 7; i++) { const p = box(.21, .004, .297, M('#f7f5ef'), -.25 + rnd() * .9, .818 + i * .003, -.05 + rnd() * .45); p.rotation.y = (rnd() - .5) * 1.2; papiers.push(p);
  for (let l = 0; l < 6; l++) { const t = box(.12 + rnd() * .05, .001, .006, M('#7a7f8c'), 0, .003, -.1 + l * .035, p); } }
const stylo = box(.012, .012, .15, '#1E40AF', .3, .83, .5); stylo.rotation.y = .7;
const calc = box(.1, .02, .16, '#2b2b2b', .75, .825, .05); box(.08, .002, .04, M('#9fc29a', {emissive: '#3a5a36'}), 0, .011, -.05, calc);
const mug = new THREE.Mesh(new THREE.CylinderGeometry(.05, .045, .11, 10), M('#e3a32b')); mug.position.set(-.45, .87, .5); mug.castShadow = true; scene.add(mug);
const tel = box(.08, .01, .16, '#111', .6, .822, .55); tel.rotation.y = -.3;
// suspension au-dessus de la table : la lumière chaude
const abat = new THREE.Mesh(new THREE.ConeGeometry(.28, .22, 12, 1, true), M('#2f2f2f', {side: THREE.DoubleSide})); abat.position.set(.2, 2.05, .2); scene.add(abat);
box(.01, 1.05, .01, '#222', .2, 2.68, .2);
const ampoule = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 6), new THREE.MeshBasicMaterial({color: '#ffe2a8'})); ampoule.position.set(.2, 1.95, .2); scene.add(ampoule);
const lampe = new THREE.SpotLight('#ffcf8a', 13, 6, Math.PI / 3.2, .55, 1.6); lampe.position.set(.2, 1.95, .2); lampe.target.position.set(.2, 0, .2);
lampe.castShadow = true; lampe.shadow.mapSize.set(1024, 1024); lampe.shadow.bias = -.0005; scene.add(lampe, lampe.target);
const fill = new THREE.PointLight('#ffb870', 1.6, 5, 2); fill.position.set(.2, 1.7, .8); scene.add(fill);
const lune = new THREE.DirectionalLight('#7f9cff', .9); lune.position.set(1.5, 3, -6); scene.add(lune);
scene.add(new THREE.HemisphereLight('#5a6a9a', '#3a2a1c', .9));
const sousMeuble = new THREE.PointLight('#ffd9a0', 5, 3.2, 2); sousMeuble.position.set(-1.5, 1.95, -2.1); scene.add(sousMeuble);
const bleu = new THREE.PointLight('#8aa4ff', 2.5, 5, 2); bleu.position.set(1, 2, -2.4); scene.add(bleu);
const faceInes = new THREE.PointLight('#ffd1a0', 3.5, 3, 2); faceInes.position.set(-.55, 1.75, -.45); scene.add(faceInes);

// ---------- personnages (sans yeux, sans bouche) ----------
function perso(o) {
  const root = new THREE.Group(); scene.add(root);
  const hips = new THREE.Group(); hips.position.y = o.assis ? .5 : .95; root.add(hips);
  const torse = new THREE.Group(); hips.add(torse);
  box(.42, .55, .24, o.haut, 0, .3, 0, torse); box(.44, .12, .26, o.haut, 0, .55, 0, torse);          // buste + épaules
  if (o.col) box(.2, .06, .05, o.col, 0, .5, .12, torse);
  const cou = box(.1, .08, .1, o.peau, 0, .64, 0, torse);
  const tete = new THREE.Group(); tete.position.y = .68; torse.add(tete);
  box(.24, .28, .25, o.peau, 0, .14, 0, tete);                                                          // tête
  box(.045, .07, .03, o.peau, 0, .11, .135, tete);                                                      // nez (seul relief du visage)
  box(.03, .07, .05, o.peau, -.13, .13, 0, tete); box(.03, .07, .05, o.peau, .13, .13, 0, tete);        // oreilles
  box(.27, .1, .28, o.cheveux, 0, .3, -.005, tete); box(.27, .2, .07, o.cheveux, 0, .2, -.115, tete);   // cheveux
  if (o.longs) { box(.28, .42, .09, o.cheveux, 0, .02, -.12, tete); box(.05, .3, .2, o.cheveux, -.135, .1, -.03, tete); box(.05, .3, .2, o.cheveux, .135, .1, -.03, tete); }
  else { box(.03, .1, .18, o.cheveux, -.13, .24, -.04, tete); box(.03, .1, .18, o.cheveux, .13, .24, -.04, tete); }
  const bras = s => { const ep = new THREE.Group(); ep.position.set(s * .27, .55, 0); torse.add(ep);
    box(.12, .3, .13, o.haut, 0, -.15, 0, ep); const coude = new THREE.Group(); coude.position.y = -.3; ep.add(coude);
    box(.11, .28, .12, o.haut, 0, -.14, 0, coude); box(.09, .09, .1, o.peau, 0, -.32, 0, coude); return {ep, coude}; };
  const bg = bras(-1), bd = bras(1);
  const jambe = s => { const h = new THREE.Group(); h.position.set(s * .11, 0, 0); hips.add(h);
    box(.17, .45, .18, o.bas, 0, -.22, 0, h); const g = new THREE.Group(); g.position.y = -.45; h.add(g);
    box(.15, .45, .16, o.bas, 0, -.22, 0, g); box(.16, .08, .26, o.chaussures, 0, -.47, .05, g); return {h, g}; };
  const jg = jambe(-1), jd = jambe(1);
  if (o.assis) for (const j of [jg, jd]) { j.h.rotation.x = -Math.PI / 2; j.g.rotation.x = Math.PI / 2; }
  return {root, hips, torse, tete, bg, bd, jg, jd};
}
const karim = perso({assis: true, peau: '#b97c4f', cheveux: '#23170f', haut: '#2c3e6b', col: '#f2b705', bas: '#3b3f47', chaussures: '#4a3424'});
karim.root.position.set(.35, 0, 1.0); karim.root.rotation.y = Math.PI;          // assis, face à la table
const ines = perso({peau: '#d9a47c', cheveux: '#3a2416', haut: '#b8432f', bas: '#34476b', chaussures: '#e8e2d6', longs: true});
ines.root.position.set(-1.3, 0, -1.25); ines.root.rotation.y = .6;            // adossée au plan de travail
// bras croisés d'Inès
for (const [b, s] of [[ines.bg, -1], [ines.bd, 1]]) { b.ep.rotation.x = -.2; b.ep.rotation.z = -s * .08; b.coude.rotation.order = 'YXZ'; b.coude.rotation.x = -1.55; b.coude.rotation.y = -s * 1.15; b.coude.position.z = s * .015; }
// Karim écrit : bras droit sur la table
karim.bd.ep.rotation.x = -1.0; karim.bd.coude.rotation.x = -.6; karim.bg.ep.rotation.x = -.9; karim.bg.coude.rotation.x = -.8; karim.bg.ep.rotation.z = .25;

// ---------- plans et jeu ----------
let TL = []; window.setTimeline = t => { TL = t; };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const PLANS = {   // [caméra départ, caméra fin, cible départ, cible fin]
  large:  [V(2.6, 1.7, 1.7), V(2.3, 1.62, 1.35), V(-.55, 1.1, -.35), V(-.5, 1.1, -.3)],
  karim:  [V(.1, 1.38, -.45), V(.16, 1.34, -.25), V(.35, 1.28, 1.0), V(.35, 1.28, 1.0)],
  ines:   [V(-.25, 1.5, .35), V(-.4, 1.5, .1), V(-1.3, 1.5, -1.25), V(-1.3, 1.5, -1.25)],
  papiers:[V(.05, 1.3, .7), V(.3, 1.22, .5), V(.15, .82, .1), V(.3, .82, .15)],
  ines2:  [V(-.75, 1.5, .85), V(-.62, 1.48, .55), V(-1.3, 1.48, -1.25), V(-1.3, 1.48, -1.25)],
  karim2: [V(-.35, 1.32, -.15), V(-.2, 1.3, 0), V(.35, 1.24, 1.0), V(.35, 1.24, 1.0)],
  ines3:  [V(-.45, 1.5, .05), V(-.62, 1.5, -.2), V(-1.3, 1.5, -1.25), V(-1.3, 1.5, -1.25)],
  deux:   [V(-1.5, 1.66, -2.0), V(-1.42, 1.64, -1.85), V(.35, 1.2, 1.0), V(.35, 1.2, 1.0)],
  karim3: [V(.25, 1.28, -.15), V(.3, 1.22, .2), V(.35, 1.18, 1.0), V(.35, 1.14, 1.0)],
};
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const c0 = new THREE.Vector3(), c1 = new THREE.Vector3();
window.render = t => {
  let cur = TL[0], i = 0;
  for (let k = 0; k < TL.length; k++) if (t >= TL[k].plan_debut) { cur = TL[k]; i = k; }
  const p = PLANS[cur.plan] || PLANS.large; const u = ease(Math.min(1, Math.max(0, (t - cur.plan_debut) / Math.max(.5, cur.plan_fin - cur.plan_debut))));
  cam.position.lerpVectors(p[0], p[1], u); c0.lerpVectors(p[2], p[3], u); cam.lookAt(c0);
  // qui parle
  const parle = TL.find(r => t >= r.debut && t <= r.fin);
  const kParle = parle && parle.qui === 'karim', iParle = parle && parle.qui === 'ines';
  // Karim : écrit, puis lève la tête vers Inès, puis baisse la tête à la fin
  const finK = TL.find(r => r.plan === 'karim3');
  const ecrit = t < (TL[2] ? TL[2].debut : 6);
  karim.bd.coude.rotation.z = ecrit ? Math.sin(t * 7) * .12 : 0;
  let yaw = ecrit ? 0 : .55, pitch = ecrit ? .35 : -.05;
  if (finK && t > finK.debut - .3) { yaw = .15; pitch = .45; }
  karim.tete.rotation.y += (yaw - karim.tete.rotation.y) * .25; karim.tete.rotation.x += (pitch - karim.tete.rotation.x) * .25;
  karim.tete.rotation.x += kParle ? Math.sin(t * 9) * .035 : 0; karim.torse.rotation.y = kParle ? Math.sin(t * 3) * .04 : 0;
  karim.torse.position.y = Math.sin(t * 1.6) * .006;                     // respiration
  // Inès : regarde Karim, bouge la tête quand elle parle
  ines.tete.rotation.y = .35 + (iParle ? Math.sin(t * 4) * .06 : 0); ines.tete.rotation.x = iParle ? Math.sin(t * 8) * .04 : .05;
  ines.torse.rotation.z = Math.sin(t * 1.2) * .015; ines.torse.position.y = Math.sin(t * 1.5) * .006;
  hM.rotation.z = -t * .01;
  renderer.render(scene, cam);
  return true;
};
window.pret = true;
