let EP = null; window.setEpisode = e => { EP = e; };
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const V = a => new THREE.Vector3(...a); const c0 = new THREE.Vector3();
window.render = t => {
