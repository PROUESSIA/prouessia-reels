const FONDS = {chambre: '#0b0f1e', camion: '#05070f', cuisine_lefevre: '#1a1410', cuisine_jour: '#cfdcea', parking: '#05070f', maison_rocher: '#0a0d14'};

// ---------- lecture de l'épisode ----------
let EP = null; window.setEpisode = e => { EP = e; };
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const V = a => new THREE.Vector3(...a); const c0 = new THREE.Vector3();
window.render = t => {
  const plans = EP.plans; let p = plans[0];
  for (const q of plans) if (t >= q.debut) p = q;
  const d = DECORS[p.decor]; const x0 = d.g.position.x;
  for (const k in DECORS) DECORS[k].g.visible = k === p.decor;
  scene.background = new THREE.Color(FONDS[p.decor]);
  const u = ease(Math.min(1, Math.max(0, (t - p.debut) / Math.max(.5, p.fin - p.debut))));
  cam.position.lerpVectors(V(p.cam[0]), V(p.cam[1]), u); cam.position.x += x0;
  c0.lerpVectors(V(p.cible[0]), V(p.cible[1]), u); c0.x += x0; cam.lookAt(c0);
  cam.fov = p.fov || 44; cam.updateProjectionMatrix();
  const ev = new Set((EP.evenements || []).filter(e => e.decor === p.decor && t >= e.debut && t <= e.fin).map(e => e.nom));
  d.update(t, ev);
  // qui parle : petits mouvements de tête ; les autres respirent
  const parle = EP.repliques.find(r => t >= r.debut && t <= r.fin);
  for (const [nom, pp] of Object.entries(d.persos)) {
    const actif = parle && parle.qui === nom;
    const regard = (p.regards || {})[nom] || [0, 0];
    pp.tete.rotation.y = regard[0] + (actif ? Math.sin(t * 4) * .06 : Math.sin(t * .7) * .02);
    if (!ev.has('sms') || nom !== 'julien') pp.tete.rotation.x = regard[1] + (actif ? Math.sin(t * 9) * .04 : 0);
    pp.torse.position.y = Math.sin(t * 1.5 + nom.length) * .006;
  }
  renderer.render(scene, cam); return true;
};
window.pret = true;
</script></body></html>
